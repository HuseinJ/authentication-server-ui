services:
  svelte-app:
    build:
      context: .
      dockerfile: dockerfile
      args:
        # Baked into the build as VITE_API_URL
        BACKEND_API_URL: ${BACKEND_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    env_file:
      - path: .env
        required: false
