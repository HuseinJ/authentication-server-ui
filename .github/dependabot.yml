version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [ "minor", "patch" ]
      npm-major:
        update-types: [ "major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # Stay on the Node LTS line (even majors); move to the next LTS by hand,
      # together with node-version in pr-build.yml
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
