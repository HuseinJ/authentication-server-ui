name: Build and Push Frontend
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      BACKEND_API_URL:
        description: 'Backend API URL'
        required: true
        default: 'https://authapi.hjusic.com'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/huseinj/auth-ui
      BACKEND_API_URL: ${{ github.event.inputs.BACKEND_API_URL || 'https://authapi.hjusic.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Time-sortable tag consumed by Flux image automation (newest deploys to the cluster)
      - name: Compute image tag
        id: tag
        run: echo "value=$(date -u +%Y%m%d%H%M%S)-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BACKEND_API_URL=${{ env.BACKEND_API_URL }} \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ steps.tag.outputs.value }} .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ steps.tag.outputs.value }}
