version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait after a release before proposing it; security updates bypass this
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    ignore:
      # SvelteKit, svelte-check and typescript-eslint don't support TypeScript 7 yet
      - dependency-name: "typescript"
        versions: [ ">=7" ]
    groups:
      npm-minor-and-patch:
        update-types: [ "minor", "patch" ]
      npm-major:
        update-types: [ "major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait after a release before proposing it; security updates bypass this
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait after a release before proposing it; security updates bypass this
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Stay on the Node LTS line (even majors); move to the next LTS by hand,
      # together with node-version in pr-build.yml
      - dependency-name: "node"
        update-types: [ "version-update:semver-major" ]
